[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "venv"]

[tool.ruff.lint.per-file-ignores]
# These load .env before importing modules that read it at import time
"main.py" = ["E402"]
"scripts/*.py" = ["E402"]
